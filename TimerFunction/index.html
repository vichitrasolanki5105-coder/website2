<body>
    <button id="startTimeOut">Start Timerout</button>
    <button id="EndTimeOut">End Timerout</button>
    <button id="StartInterval">Start Interval</button>
    <button id="EndInterval">End Interval</button>
</body>
<script>
    var timeOut = document.querySelector("#startTimeOut");
    var endTimeOut = document.querySelector("#EndTimeOut");
    var id= null;
    var StartInterval = document.querySelector("#StartInterval");
    var EndInterval = document.querySelector("#EndInterval");
    var  intervalId;

    // setTimeout(callback_function, delayTime(ms), ags1,arg2,...)

    var fun = (name)=>{
        console.log("hello", name);
    };
    timeOut.addEventListener("click", ()=>{
        id = setTimeout(fun, 1000, "Vichitra");
        console.log(id);
    });

    // });

    endTimeOut.addEventListener("click", ()=>{
        clearTimeout(id);
    });

    StartInterval.addEventListener("click", ()=>{
        let count = 0;
        intervalId = setInterval(()=>{
            console.log("Interval Running", ++count);
        }, 2000);
    });

    EndInterval.addEventListener("click", ()=>{
        clearInterval(intervalId);
    });
