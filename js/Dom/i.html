<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Events</h2>

    <button id="clickBtn">Click Me</button>
    <div id="box" style="padding: 20px; background: lightblue; margin: 10px 0">
      Move your mouse over this box
    </div>

    <input type="text" id="keyInput" placeholder="Type something" />

    <form id="myForm">
      <input type="text" id="username" placeholder="Enter username" required />
      <input type="email" id="email" placeholder="Enter email" required />
      <button type="submit">Submit</button>
    </form>

    <script>
        // Element.addEventListner(event, handling_function)

        var btn = document.querySelector("#clickBtn");
        var box = document.querySelector("#box");



        btn.addEventListener("click",()=>{
            console.log("Click")
        })

        box.addEventListener('mouseover',()=>{
            box.style["background-color"] = "red";
        })

        box.addEventListener('mouseout',()=>{
            box.style.backgroundColor = 'lightblue';
        })

        // mousemove
        box.addEventListener("mousemove",(event)=>{
            box.innerHTML = `X : ${event.clientX} Y : ${event.clientY}`;
        })

        // MouseDown and mouseup



    </script>
</body>
</html>
