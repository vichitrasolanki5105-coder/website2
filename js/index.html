<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
    //if-else
    // if(true){
    //     console.log("Hello Vichitra Solanki");
    // }
    if(false){
        console.log("Hello Vichitra Solanki");
    } else{
        console.log("error");
    }

    var marks = parseInt(prompt('Enter the Marks:- '));

    if(marks >=80){
        console.log('Grade A');
    }else if(marks >=60){
        console.log('Grade B');
    }else{
        console.log('Grade C');
    }
    //switch
    var day = 'tues';

    switch(day){
        case 'mon':
            console.log('Monday');
            break;
        case 'tues':
            console.log('Tuesday');
            break;
        default:
            console.log('error');
            break;    
    }
    //ternary operator
    var num = (5=='5')?6:7;
    console.log(num);

    (5!='5')?console.log('Hello'):console.log('error');
    //For Loop
    for(let i=0; i<5;i++){
        console.log('for Loop :-'+i);
    }
    //While Loop
    let n=405;
    while(n>0){
        console.log("While Loop :-"+n%10);
        n=Math.floor(n/10);
    }
    //Do-While Loop
    let n2=5;
    do{
        console.log('Hello'+n2);
        n2--;
    }while(n2<0);
    //Nested Loop
    for(let i=0; i<5;i++){
        for(let j=0; j<6;j++){
            console.log("nested loop:"+i+"-"+j);
        }
    }
    
</script>
</html>
