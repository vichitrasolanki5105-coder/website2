        console.log(arr.reduce((sum,data)=> sum+Number(data.age)));

        // calculate a result in sequence.

        var arr1=[8,9,55,6,2,52,5,4,5,2,1,7,8,5,9];
        console.log(arr1.filter((data)=> data%2===0).map((num)=> num+5).reduce((sum,num)=> sum+num));
