<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <h1>Todo List</h1>
    <form>
        <input type="text" id="input" placeholder="Enter the task" />
        <button type="submit">Submit</button>
    </form>
    <div id="taskCont"></div>
</body>
<script>
    var form = document.querySelector('form');
    var input = document.querySelector('#input');
    var taskCont = document.querySelector("#taskCont");
    var tasks = [];

    form.addEventListener("submit", (event)=>{
        event.preventDefault();

        tasks.push(input.value);
        console.log(tasks);
        input.value = "";
        addEle();
    });

    function addEle(){
        taskCont.innerHTML = "";

        tasks.forEach((data,index)=>{
            taskCont.innerHTML += `<p>${data}</p> <button onclick="deleteEle(${index})">Delete</button>`;
        });
    }

    function deleteEle(index){
        tasks = tasks.filter((data, i)=> i!== index);
        addEle();
    }
</script>
</html>
